<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body      { width: 280px; padding: 12px; font-family: sans-serif; }
    button    { width: 100%; padding: 8px; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #hint     { font-size: 12px; color: #555; line-height: 1.45; margin-bottom: 10px; }
    #status   { margin-top: 8px; font-size: 12px; color: #555; min-height: 16px; }
  </style>
</head>
<body>
  <div id="hint">
    Scroll down on the LinkedIn connections page to load more — this extension
    collects them as you go. Come back here and click Export whenever you're
    ready; it exports everyone loaded so far.
  </div>
  <button id="export">Export <span id="count"></span></button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
